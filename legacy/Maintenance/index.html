<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Under Maintenance</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png"
        href="https://res.cloudinary.com/dnxoz9alm/image/upload/v1770803115/FavIcon_gtzgb7.png" />

    <!-- Open Graph / SEO -->
    <meta property="og:title" content="Website Under Maintenance" />
    <meta property="og:description"
        content="This website is currently under development or scheduled technical maintenance. We will be back online very soon." />
    <meta property="og:image"
        content="https://res.cloudinary.com/dnxoz9alm/image/upload/v1772523612/Post_10_-_4_atlsb8.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Website Under Maintenance" />
    <meta name="twitter:description"
        content="This website is currently under development or scheduled technical maintenance. We will be back online very soon." />
    <meta name="twitter:image"
        content="https://res.cloudinary.com/dnxoz9alm/image/upload/v1772523612/Post_10_-_4_atlsb8.png" />

    <!-- Fontes: Plus Jakarta Sans para a estrutura, Playfair Display para os itálicos elegantes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;700;800&display=swap"
        rel="stylesheet" />

    <!-- Ícones -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: '#2563EB', // Azul Elétrico do Studio 17
                        royal: '#0456FE', // Novo Azul Vibrante
                        dark: '#0F172A', // Slate escuro
                        light: '#FFFFFF',
                    },
                },
            },
        };
    </script>

    <style>
        /* Animação Abstrata Gráfica de Fundo */
        @keyframes slow-spin {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .graphic-container svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
            animation: slow-spin 140s linear infinite;
        }
    </style>
</head>

<body
    class="bg-light text-dark antialiased h-screen w-screen overflow-hidden flex flex-col relative selection:bg-primary selection:text-white">

    <!-- Gráfico Abstrato Central (Anéis de Tecnologia) -->
    <div class="absolute inset-0 pointer-events-none z-0 flex items-center justify-center opacity-[0.15]"
        style="mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);">
        <svg class="h-[120vh] w-auto max-w-none" viewBox="-200 -200 1400 1400" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="ringGrad1" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8" />
                    <stop offset="50%" stop-color="#0456FE" stop-opacity="0.3" />
                    <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
                </linearGradient>
            </defs>

            <!-- Arcos Interiores Suaves -->
            <circle cx="500" cy="500" r="400" stroke="url(#ringGrad1)" stroke-width="80" stroke-linecap="round"
                class="blur-[10px]" stroke-dasharray="1600 2500" />
            <circle cx="500" cy="500" r="400" stroke="url(#ringGrad1)" stroke-width="40" stroke-linecap="round"
                class="blur-[3px]" stroke-dasharray="1600 2500" />

            <!-- Anéis Pontilhados Exteriores -->
            <circle cx="500" cy="500" r="490" stroke="#0456FE" stroke-width="20" stroke-dasharray="0 60"
                stroke-linecap="round" class="opacity-40" />
            <circle cx="500" cy="500" r="530" stroke="#2563EB" stroke-width="10" stroke-dasharray="0 40"
                stroke-linecap="round" class="opacity-20" />
        </svg>
    </div>

    <!-- Conteúdo Central -->
    <main class="flex-grow flex flex-col items-center justify-center relative z-10 px-6 text-center">

        <!-- Badge de Status (Com indicador luminoso/pulse) -->
        <div
            class="inline-flex items-center gap-2 bg-gradient-to-r from-slate-100 to-transparent backdrop-blur-md rounded-full pl-4 pr-12 py-2 mb-8 border-l border-slate-300">
            <div class="w-2 h-2 rounded-full bg-primary animate-pulse shadow-[0_0_10px_rgba(37,99,235,0.8)]"></div>
            <span class="text-sm font-semibold text-dark tracking-wide uppercase">System Maintenance</span>
        </div>

        <!-- Título Principal -->
        <h1 class="text-4xl md:text-5xl lg:text-[4rem] font-bold text-dark leading-[1.15] tracking-tight mb-8">
            Ecosystem <br class="hidden md:block" /> temporarily offline.
        </h1>

        <!-- Descrição (Efeito de vidro no fundo para garantir leitura sobre a animação) -->
        <div class="relative max-w-2xl">
            <div class="absolute -inset-8 z-[-1] backdrop-blur-sm pointer-events-none"
                style="mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%);">
            </div>
            <p class="text-lg md:text-xl lg:text-2xl text-slate-500 font-serif italic leading-relaxed">
                This website is currently under development or scheduled technical maintenance. We will be back online
                very soon.
            </p>
        </div>

    </main>

    <!-- Assinatura do Studio 17 (Fixa no fundo) -->
    <div class="relative z-20 pb-10 flex flex-col items-center justify-center gap-3 mt-auto">
        <span class="text-[11px] md:text-xs font-bold uppercase tracking-[0.2em] text-slate-400">
            Developed and maintained by
        </span>

        <a href="https://www.studio17.world/" target="_blank" rel="noopener noreferrer"
            class="flex items-baseline select-none opacity-80 hover:opacity-100 hover:scale-105 transition-all duration-300 cursor-pointer">
            <span class="font-extrabold text-2xl md:text-3xl text-dark" style="letter-spacing: -0.05em;">Studio</span>
            <span class="font-extrabold text-2xl md:text-3xl text-dark ml-1.5"
                style="letter-spacing: -0.12em;">17</span>
        </a>
    </div>

</body>

</html>
